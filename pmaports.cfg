# Reference: https://postmarketos.org/pmaports.cfg
[pmaports]
version=7
pmbootstrap_min_version=3.11.0
channel=edge
install_user_groups=audio,netdev,plugdev,video,wheel
supported_root_filesystems=btrfs,ext4,f2fs,xfs
supported_firewall=nftables
supported_base_nofde=True
supported_install_boot_label=pmOS_i_boot
supported_mkinitfs_without_flavors=True
supported_arches=aarch64,armv7,loongarch64,ppc64le,riscv64,x86_64
supported_fastboot_depends=android-tools-fastboot,android-tools-mkbootimg
supported_heimdall_depends=heimdall,android-tools-mkbootimg
supported_mtkclient_depends=mtkclient,android-tools-mkbootimg
supported_usr_merge=True
supported_bin_merge=True
systemd_linux_min_version=5.4
systemd_linux_recommended_version=5.7

[repo:systemd]
pmaports_dir=systemd
